name: Publish

# Tag-triggered. Trusted publishing (OIDC) — there is no PYPI_API_TOKEN secret,
# and there should never be one. One-time PyPI setup:
#   project -> Publishing -> add a GitHub publisher with
#   repository `eventlog-pro`, workflow `publish.yml`, environment `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Assert the tag matches __about__.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, re, pathlib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          source = pathlib.Path("src/eventlog_pro/__about__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          assert tag == version, f"tag {tag!r} does not match __version__ {version!r}"
          print(f"publishing {version}")
          PY

      - name: Assert the wheel ships migrations and py.typed
        run: |
          python - <<'PY'
          import zipfile, glob
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = [
              "eventlog_pro/py.typed",
              "eventlog_pro/contrib/django/migrations/0001_initial.py",
              "eventlog_pro/contrib/django/migrations/0002_add_indexes.py",
          ]
          missing = [name for name in required if name not in names]
          assert not missing, f"missing from the wheel: {missing}"
          print("wheel contents verified")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no long-lived token anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
